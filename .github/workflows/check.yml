name: Check assistant
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r catalog_tool/requirements.txt -r workspace_tool/requirements.txt httpx==0.28.1
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s catalog_tool/tests -v
      - run: python -m unittest discover -s workspace_tool/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm --dir workspace_tool/web install --frozen-lockfile
      - run: pnpm --dir workspace_tool/web run test
      - run: pnpm --dir workspace_tool/web run build
      - run: pnpm --dir workspace_tool/web exec playwright install --with-deps chromium
      - run: pnpm --dir workspace_tool/web run test:e2e
      - run: python scripts/audit_public.py

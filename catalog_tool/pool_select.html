<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>选择产品</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#26352f;background:#f6f7f5;font-size:18px;--accent:#285f49}
*{box-sizing:border-box}
body{margin:0}
.topbar{position:sticky;top:0;z-index:2;background:#f6f7f5;border-bottom:1px solid #e3e7e2}
.heading{max-width:1120px;margin:auto;padding:26px 28px 22px;display:flex;align-items:center;justify-content:space-between;gap:28px}
.heading-text{min-width:0;flex:1}.heading-actions{display:flex;align-items:center;gap:22px}
.icon-button{display:grid;place-items:center;flex-shrink:0;width:52px;height:52px;border:1px solid #b9cabe;border-radius:12px;background:#fff;color:var(--accent);cursor:pointer}
.icon-button svg{width:26px;height:26px}.icon-button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #aac9b9;outline-offset:3px}
.icon-button[data-active="true"]{background:#e5f0e8;border-color:var(--accent)}
dialog{width:min(520px,calc(100% - 32px));max-height:calc(100% - 40px);padding:28px;border:1px solid #c9d6cc;border-radius:18px;color:#26352f;background:#fff;box-shadow:0 20px 70px #182b2330}
dialog::backdrop{background:#20392d55}.dialog-heading{display:flex;align-items:center;justify-content:space-between;gap:18px}.dialog-heading h2{margin:0;font-size:26px}.dialog-heading .icon-button{border:0;width:44px;height:44px}
.share-note{font-size:18px;line-height:1.7;color:#536359;margin:16px 0}.share-duration{margin:20px 0;font-size:20px}.duration-label{display:block;margin-bottom:12px}.duration-control{display:flex;gap:8px;align-items:center}.duration-control input{width:100%;text-align:center;min-width:0;font:inherit;font-size:22px;padding:12px 6px;border:1px solid #b9cabe;border-radius:8px}.duration-control button{flex-shrink:0}.duration-help{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;font-size:18px;color:#536359}.duration-help button{font:inherit;border:0;background:transparent;color:var(--accent);text-decoration:underline;cursor:pointer;min-height:44px;padding:8px}.share-footnote{margin:18px 0 0;font-size:16px;line-height:1.6;color:#536359}
.duration-control button{font:inherit;font-size:26px}
select,.share-link{font:inherit;font-size:18px;padding:12px;border:1px solid #b9cabe;border-radius:8px;min-width:0;background:#fff;color:inherit}
.share-link{width:100%;margin:6px 0 16px}.share-message{font-size:20px;line-height:1.7;margin:20px 0 8px;overflow-wrap:anywhere}.share-expiry{font-size:18px;line-height:1.6;color:#536359;margin:0 0 18px}
.share-buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.action-button{font:inherit;font-size:20px;min-height:52px;padding:10px 20px;border-radius:9px;border:1px solid #aabdac;background:#fff;color:#285f49;cursor:pointer}.action-button.primary{background:#285f49;border-color:#285f49;color:#fff}.action-button:disabled{opacity:.55;cursor:wait}
body.readonly .product{cursor:default}body.readonly .summary{display:none}
h1{font-size:32px;line-height:1.4;letter-spacing:.01em;margin:0 0 10px;font-weight:650;overflow-wrap:anywhere}
.instruction{margin:0;color:#4e6055;font-size:18px;line-height:1.7}
.summary{flex-shrink:0;min-width:148px;text-align:right;font-variant-numeric:tabular-nums}
.count{margin:0;font-size:18px;white-space:nowrap;color:#4e6055}
.count strong{font-size:30px;font-weight:650;color:var(--accent);margin:0 5px}
.save-state{margin:6px 0 0;min-height:25px;font-size:16px;color:#4e6055;white-space:nowrap}
.save-state[data-status="error"]{color:#ac4436}
.notice{max-width:1064px;margin:0 auto 18px;padding:14px 18px;border-radius:8px;background:#fff0e9;color:#943f30;font-size:18px;line-height:1.7}
[hidden]{display:none!important}
main{max-width:1120px;margin:24px auto;padding:0 28px 40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.product{position:relative;display:flex;flex-direction:column;min-width:0;padding:24px;background:#fff;border:1px solid #d5ddd6;border-radius:14px;cursor:pointer;transition:border-color .12s ease,box-shadow .12s ease}
.product:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.product:has(input:focus-visible){outline:3px solid #aac9b9;outline-offset:4px}
.product:has(input:disabled){cursor:default}
.choice-row{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-bottom:18px;color:#4e6055;font-size:18px}
.chosen-text{display:none}
.product:has(input:checked) .choose-text{display:none}
.product:has(input:checked) .chosen-text{display:inline;color:var(--accent);font-weight:650}
.choice{appearance:none;width:44px;height:44px;flex-shrink:0;margin:0;border:2px solid #7f9284;border-radius:9px;background:#fff;cursor:inherit;display:grid;place-content:center;outline:none}
.choice:checked{background:var(--accent);border-color:var(--accent)}
.choice:checked:after{content:"";width:18px;height:10px;border-left:3px solid white;border-bottom:3px solid white;transform:translateY(-2px) rotate(-45deg)}
.product-top{display:flex;align-items:center;gap:24px;min-height:132px}
.picture{width:128px;height:132px;flex-shrink:0;display:grid;place-items:center;background:#fff;border-radius:9px;overflow:hidden}
.picture img{display:block;width:100%;height:100%;object-fit:contain}
.no-image{background:#f4f6f3;color:#536359;font-size:16px;text-align:center}
.identity{min-width:0}
h2{font-size:24px;font-weight:650;line-height:1.5;margin:0 0 12px;overflow-wrap:anywhere}
.price{margin:5px 0 0;line-height:1.55;overflow-wrap:anywhere}
.price-label{display:block;font-size:18px;color:#536359;margin-bottom:2px}
.price-value{font-size:30px;font-weight:650;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums}
.facts{margin-top:22px;padding-top:18px;border-top:1px solid #e3e8e1;white-space:pre-line;line-height:1.85;color:#3f5146;font-size:18px;overflow-wrap:anywhere}
.tags{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:18px 0 0;color:#536359;font-size:16px;line-height:1.7}
.tag{padding:3px 10px;background:#f3f6f2;border-radius:5px;color:#46624f}
.source{margin:18px 0 0;color:#59685d;font-size:16px;line-height:1.7;overflow-wrap:anywhere}
@media(hover:hover) and (pointer:fine){.product:hover{border-color:#9cb9a8}.product:has(input:checked):hover{border-color:var(--accent)}}
@media(max-width:820px){main{grid-template-columns:1fr}}
@media(max-width:700px){.topbar{position:static}.heading{padding:20px;display:block}h1{font-size:28px}.heading-actions{margin-top:16px;justify-content:space-between;gap:12px}.summary{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;text-align:left}.save-state{margin:0}.notice{margin:0 16px 14px}main{margin-top:16px;padding:0 16px 30px;gap:18px}.product{padding:20px}.product-top{gap:18px;min-height:110px}.picture{width:102px;height:110px}h2{font-size:23px}dialog{padding:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="heading">
    <div class="heading-text"><h1 id="title">看看想选哪几款</h1><p id="instruction" class="instruction">点一下选中，再点一下取消。<br>选好后，回到聊天里告诉我“选好了”。</p></div>
    <div class="heading-actions"><div class="summary" aria-live="polite" aria-atomic="true">
      <p class="count">已选<strong id="selected-count">0</strong>款</p>
      <p id="status" class="save-state" role="status">正在读取…</p>
    </div><button id="share-open" class="icon-button" type="button" title="分享给别人看" aria-label="分享给别人看" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg>
    </button></div>
  </div>
  <p id="notice" class="notice" role="alert" hidden></p>
</header>
<main id="products" aria-label="候选产品" aria-busy="true"></main>
<dialog id="share-dialog" aria-labelledby="share-title">
  <div class="dialog-heading"><h2 id="share-title">分享商品</h2><button id="share-close" class="icon-button" type="button" aria-label="关闭分享窗口"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <p class="share-note">别人只能查看本页商品和价格。</p>
  <div id="share-settings" class="share-duration">
    <label class="duration-label" for="share-duration">有效时间</label>
    <div class="duration-control"><button id="share-less" class="icon-button" type="button" aria-label="减少一小时">−</button><input id="share-duration" type="text" value="永久" maxlength="12" autocomplete="off" aria-describedby="duration-hint"><button id="share-more" class="icon-button" type="button" aria-label="增加一小时">＋</button></div>
    <div class="duration-help"><span id="duration-hint">数字按小时计算</span><button id="share-forever" type="button">设为永久</button></div>
  </div>
  <p id="share-message" class="share-message" role="status" aria-live="polite">正在读取…</p>
  <p id="share-expiry" class="share-expiry" hidden></p>
  <input id="share-link" class="share-link" aria-label="分享链接" readonly hidden>
  <div class="share-buttons"><button id="share-copy" type="button" class="action-button primary" hidden>复制链接</button><button id="share-start" type="button" class="action-button primary" hidden>确认分享</button><button id="share-stop" type="button" class="action-button" hidden>停止分享</button></div>
  <p class="share-footnote">分享时，电脑需保持开机联网。</p>
</dialog>
<script>
const base=location.pathname.replace(/\/?$/,'/');
const products=document.querySelector('#products'), status=document.querySelector('#status'), notice=document.querySelector('#notice');
const controls=new Map();
let state, desired=new Set(), confirmed=new Set(), writing=false, locked=false, saveTimer, feedbackTimer;

function element(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function dirty(){return desired.size!==confirmed.size||[...desired].some(id=>!confirmed.has(id))}
function statusText(text,error=false){if(status.textContent!==text)status.textContent=text;status.dataset.status=error?'error':'saved'}
function message(text=''){notice.textContent=text;notice.hidden=!text}
function syncControls(){for(const [id,check] of controls){check.checked=desired.has(id);const disabled=locked||state.state!=='open';if(check.disabled!==disabled)check.disabled=disabled}document.querySelector('#selected-count').textContent=desired.size}
function adopt(saved){state.revision=saved.revision;state.state=saved.state;confirmed=new Set(saved.selected_ids);desired=new Set(confirmed);syncControls()}
function settledStatus(){statusText(state.state==='sealed'?'已经选好了':state.state==='closed'?'这次选择已结束':'选择会自动保存')}

function renderProducts(){
  document.querySelector('#title').textContent=state.title;
  document.title=state.title;
  if(state.readonly){
    document.body.classList.add('readonly');document.querySelector('#share-dialog').remove();
    document.querySelector('#instruction').textContent='商品详情请联系分享人。';
    if(state.expires_at)document.querySelector('#instruction').append(element('span',' 本链接最多保留至 '+new Date(state.expires_at*1000).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'。'));
  }else document.querySelector('#share-open').hidden=!state.sharing;
  const fragment=document.createDocumentFragment();
  for(const [index,item] of state.items.entries()){
    const card=element(state.readonly?'article':'label',undefined,'product');
    if(!state.readonly){
    const check=document.createElement('input');check.type='checkbox';check.className='choice';check.dataset.id=item.id;
    check.setAttribute('aria-label','选择 '+item.name);check.addEventListener('change',choose);controls.set(item.id,check);
    const choiceRow=element('div',undefined,'choice-row'), chooseText=element('span','选这款','choose-text'), chosenText=element('span','已选中','chosen-text');
    chooseText.setAttribute('aria-hidden','true');chosenText.setAttribute('aria-hidden','true');choiceRow.append(chooseText,chosenText,check);card.append(choiceRow);
    }
    const top=element('div',undefined,'product-top'), picture=element('div',undefined,'picture');
    if(item.image){
      const img=document.createElement('img');img.alt=item.name;img.width=118;img.height=122;img.loading=index<4?'eager':'lazy';img.src=base+'image/'+encodeURIComponent(item.id);
      img.addEventListener('error',()=>{picture.classList.add('no-image');picture.textContent='图片暂不可用'});picture.append(img);
    }else{picture.classList.add('no-image');picture.textContent='暂无图片'}
    top.append(picture);
    const identity=element('div',undefined,'identity');
    identity.append(element('h2',[item.name,item.model,item.variant].filter((v,i,a)=>v&&a.indexOf(v)===i).join(' / ')));
    for(const price of item.prices){const row=element('p',undefined,'price');row.append(element('span',price.label,'price-label'),element('span',price.value===null||price.value===''?'未提供':price.value,'price-value'));identity.append(row)}
    top.append(identity);card.append(top);if(item.features)card.append(element('div',item.features,'facts'));
    for(const origin of ['source','inferred']){
      const tags=item.tags.filter(tag=>tag.origin===origin);if(!tags.length)continue;
      const row=element('p',undefined,'tags');row.append(element('span',origin==='inferred'?'选品建议':'资料里写的'));
      for(const tag of tags){const chip=element('span',tag.value,'tag');chip.title=tag.reason;chip.setAttribute('aria-label',tag.value+'：'+tag.reason);row.append(chip)}card.append(row);
    }
    if(item.source_file){const source=element('p','资料：'+item.source_file,'source');source.title=item.locator;card.append(source)}fragment.append(card);
  }
  products.append(fragment);products.setAttribute('aria-busy','false');syncControls();settledStatus();
}

async function request(path,options={}){
  const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),10000);
  try{
    const response=await fetch(base+path,{cache:'no-store',...options,signal:controller.signal});
    if(!response.ok){const body=await response.json().catch(()=>({}));const error=new Error(body.error||'暂时没连上');error.status=response.status;throw error}
    return await response.json();
  }finally{clearTimeout(timeout)}
}

function choose(event){
  const check=event.currentTarget;
  if(locked||state.state!=='open'){syncControls();return}
  if(check.checked)desired.add(check.dataset.id);else desired.delete(check.dataset.id);
  document.querySelector('#selected-count').textContent=desired.size;message();
  if(!writing)settledStatus();
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,80);
}

async function recover(error){
  locked=true;syncControls();statusText('正在核对…',true);
  try{
    const saved=await request('state');locked=false;adopt(saved);
    if(state.state!=='open'){settledStatus();message('这次选择已经结束了。想改一改，回到聊天里告诉我就好。');return}
    statusText('请再看一下',true);
    message(error.status===409?'另一个页面改过选择，这里已经更新。请再看一下。':'刚才的更改没能确认保存，已经恢复到上次保存的结果。请再选一次。');
  }catch{
    statusText('尚未确认保存',true);
    message('暂时连不上，刚才的选择可能还没保存。请回到聊天里告诉我。');
  }
}

async function flush(){
  clearTimeout(saveTimer);
  if(writing||locked||!state||state.state!=='open'||!dirty())return;
  writing=true;
  // Short saves keep the status steady. Only a sustained wait shows progress.
  feedbackTimer=setTimeout(()=>statusText('正在保存…'),600);
  try{
    while(dirty()&&state.state==='open'){
      const ids=[...desired];
      const saved=await request('selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,revision:state.revision})});
      state.revision=saved.revision;state.state=saved.state;confirmed=new Set(saved.selected_ids);
      // A response confirms its own batch; newer local clicks remain the next batch.
      if(state.state!=='open'){adopt(saved);break}
    }
    settledStatus();
  }catch(error){clearTimeout(feedbackTimer);await recover(error)}
  finally{clearTimeout(feedbackTimer);writing=false}
}

window.addEventListener('beforeunload',event=>{if(writing||dirty()){event.preventDefault();event.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
const shareDialog=document.querySelector('#share-dialog'), shareMessage=document.querySelector('#share-message'), shareLink=document.querySelector('#share-link');
let shareTimer, shareBusy=false, shareStatus='idle';
const shareDuration=document.querySelector('#share-duration');
function readDuration(){
  const value=shareDuration.value.trim();
  if(value==='永久')return null;
  const match=value.match(/^([1-9]\d{0,3})(?:\s*小时)?$/);
  if(!match||Number(match[1])>8760)throw new Error('请填 1—8760 小时，或填“永久”');
  return Number(match[1])*60;
}
function stepDuration(change){
  let minutes;try{minutes=readDuration()}catch{shareDuration.focus();return}
  shareDuration.value=String(minutes===null?1:Math.max(1,Math.min(8760,minutes/60+change)));
  clearDurationError();
}
function clearDurationError(){if(shareMessage.dataset.durationError){shareMessage.hidden=true;delete shareMessage.dataset.durationError}}
function showShare(info){
  const busy=['preparing','connecting','checking','ready','stopping'].includes(info.status), ready=info.status==='ready';
  shareStatus=info.status;
  delete shareMessage.dataset.durationError;
  shareMessage.textContent=info.message;
  shareMessage.hidden=!info.message;
  document.querySelector('#share-open').dataset.active=String(ready);
  document.querySelector('#share-settings').hidden=busy;
  if(ready)shareDuration.value=info.minutes===null?'永久':String(info.minutes/60);
  if(shareLink.value!==(info.url||''))shareLink.value=info.url||'';
  shareLink.hidden=!ready;document.querySelector('#share-copy').hidden=!ready;
  document.querySelector('#share-start').hidden=busy;
  document.querySelector('#share-stop').hidden=!busy;
  document.querySelector('#share-stop').disabled=info.status==='stopping';
  const expiry=document.querySelector('#share-expiry');expiry.hidden=!ready;
  expiry.textContent=ready?(info.expires_at?new Date(info.expires_at*1000).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+' 到期':'永久 · 可随时停止'):'';
}
function shareError(error){shareMessage.hidden=false;shareMessage.textContent=error.status?error.message:'暂时连不上，请回聊天里让我检查一下。'}
function pollShare(){clearTimeout(shareTimer);if(shareDialog.open&&['preparing','connecting','checking','ready','stopping'].includes(shareStatus))shareTimer=setTimeout(refreshShare,shareStatus==='ready'?2000:300)}
async function refreshShare(){
  if(shareBusy){pollShare();return}
  try{showShare(await request('share'))}catch(error){shareError(error)}finally{pollShare()}
}
async function changeShare(action){
  if(shareBusy)return;
  let minutes;
  if(action==='start'){try{minutes=readDuration()}catch(error){shareMessage.dataset.durationError='true';shareMessage.hidden=false;shareMessage.textContent=error.message;shareDuration.focus();return}}
  shareBusy=true;clearTimeout(shareTimer);
  document.querySelector('#share-start').disabled=true;
  try{showShare(await request('share/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(action==='start'?{minutes}:{})}))}
  catch(error){shareError(error);document.querySelector('#share-start').hidden=false}
  finally{shareBusy=false;document.querySelector('#share-start').disabled=false;pollShare()}
}
document.querySelector('#share-open').addEventListener('click',async()=>{
  shareDialog.showModal();
  try{showShare(await request('share'));pollShare()}
  catch(error){shareError(error);document.querySelector('#share-start').hidden=false}
});
document.querySelector('#share-close').addEventListener('click',()=>shareDialog.close());
shareDialog.addEventListener('close',()=>clearTimeout(shareTimer));
document.querySelector('#share-start').addEventListener('click',()=>changeShare('start'));
document.querySelector('#share-less').addEventListener('click',()=>stepDuration(-1));
document.querySelector('#share-more').addEventListener('click',()=>stepDuration(1));
document.querySelector('#share-forever').addEventListener('click',()=>{shareDuration.value='永久';clearDurationError()});
shareDuration.addEventListener('input',clearDurationError);
shareDuration.addEventListener('keydown',event=>{if(event.key==='ArrowUp'||event.key==='ArrowDown'){event.preventDefault();stepDuration(event.key==='ArrowUp'?1:-1)}});
document.querySelector('#share-stop').addEventListener('click',()=>changeShare('stop'));
document.querySelector('#share-copy').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(shareLink.value);shareMessage.textContent='已复制，可以发给别人了'}
  catch{shareLink.focus();shareLink.select();shareMessage.textContent='请复制框里的链接，再发给别人。'}
});
if(location.protocol==='file:'){
  statusText('还没连上',true);message('请回到聊天里，让我重新打开选品页。');products.setAttribute('aria-busy','false');
}else request('state').then(saved=>{state=saved;confirmed=new Set(saved.selected_ids);desired=new Set(confirmed);renderProducts()}).catch(()=>{
  statusText('暂时打不开',true);message('请回到聊天里，让我重新打开选品页。');products.setAttribute('aria-busy','false');
});
</script>
</body>
</html>
